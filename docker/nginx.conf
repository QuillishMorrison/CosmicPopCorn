server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /auth/ {
    proxy_pass http://backend:8000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /station/ { proxy_pass http://backend:8000/station/; }
  location /market/ { proxy_pass http://backend:8000/market/; }
  location /contracts/ { proxy_pass http://backend:8000/contracts/; }
  location /meta/ { proxy_pass http://backend:8000/meta/; }
  location /sector/ { proxy_pass http://backend:8000/sector/; }
  location /transfers/ { proxy_pass http://backend:8000/transfers/; }
  location /notifications/ { proxy_pass http://backend:8000/notifications/; }
  location /admin/ { proxy_pass http://backend:8000/admin/; }
  location /health { proxy_pass http://backend:8000/health; }
}
